services:
  - type: web
    name: penguin-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: http://localhost:5173
      - key: ADMIN_EMAIL
        value: admin@penguin.com
      - key: ADMIN_PASSWORD
        value: admin123
